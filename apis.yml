apis:
- aid: mls-grid:mls-grid-web-api
  name: MLS Grid Web API v2
  description: >-
    MLS Grid's RESO Web API — a replication-oriented OData v4 surface over listing data
    normalized to the RESO Data Dictionary and pooled from the participating MLSs. Documented
    entity sets are Property, Member, Office, OpenHouse and Lookup, with Media, Rooms and
    UnitTypes available through $expand (and Media standalone where the originating MLS permits).
    Replication is driven by $filter on OriginatingSystemName plus ModificationTimestamp, paged
    with @odata.nextLink. Authentication is a long-lived OAuth 2.0 bearer token issued through the
    MLS Grid web application after a subscription, a licensee and MLS approval are in place; the
    service requires an Accept-Encoding header containing gzip on every request. Documented rate
    limits are 2 requests/second, 7,200 requests/hour, 40,000 requests/24 hours and 4 GB/hour,
    enforced with HTTP 429 and token suspension. Probed anonymously on 2026-07-26: the service
    root, /Property and $metadata all returned HTTP 401, so no machine-readable contract could be
    downloaded.
