name: MLS Grid
kind: company
description: >-
  The MLS Grid is a United States MLS data-distribution cooperative created by a network of
  Multiple Listing Services to give brokers, MLSs and technology vendors ONE normalized data
  feed, ONE license agreement and ONE compliance process instead of dozens of per-MLS RETS and
  Web API feeds. It ingests listing data from participating MLSs, converts it to the RESO Data
  Dictionary, and republishes it as a single RESO Web API (OData v4) replication surface at
  https://api.mlsgrid.com/v2/. It sits in the middle of the residential real estate value chain,
  between the MLSs that own the data and the IDX/VOW sites, portals and proptech applications
  that display it. Its API posture is the sector archetype: the documentation is genuinely public
  and complete, and MLS Grid is RESO-certified for Data Dictionary 2.0 and Web API Server Core
  2.0.0 in the RESO certification directory (UOI T00000045) — but nothing is reachable without
  credentials. Every anonymous call to the service root, to /Property and to the OData $metadata
  document returns HTTP 401. Access requires the MLS Grid Master Data License Agreement plus
  approval by each originating MLS before a long-lived OAuth 2.0 bearer token is issued in the
  MLS Grid web application. Certified, documented, and closed.
