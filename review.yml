aid: mls-grid
name: MLS Grid
reviewedOn: '2026-07-26'
reviewer: API Evangelist
classification: company
domain: Real Estate
tier: mls-data-infrastructure
homeMarket: United States
position: Consuming

summary: |
  MLS Grid is a US MLS data-distribution cooperative — created by a network of Multiple Listing
  Services and governed by a Board of Managers drawn from those MLSs — that pools listing data
  from participating MLSs, normalizes it to the RESO Data Dictionary, and republishes it through a
  single RESO Web API (OData v4) replication endpoint under ONE Master Data License Agreement.

  It is the cleanest possible illustration of this study's central question. MLS Grid is genuinely
  RESO-certified (Data Dictionary 2.0 and Web API Server Core 2.0.0, listed in the RESO directory
  of certified organizations as UOI T00000045, "Certified Current"). Its documentation is genuinely
  public: docs.mlsgrid.com serves the full v2 API reference as markdown, publishes an llms.txt
  index, and documents base URL, entity sets, filter grammar, pagination, auth header, rate limits
  and license-control fields. And none of it is callable. Anonymous requests to the service root,
  to /Property and to the OData $metadata document all return HTTP 401. The machine-readable
  contract a RESO Web API is certified against is behind the same gate as the data.

  Certified. Documented. Closed.

resoPosture:
  certified: true
  posture: >-
    RESO-certified for Data Dictionary 2.0 and Web API Server Core 2.0.0 per the RESO certification
    directory, but the OData $metadata document is HTTP 401 without a signed licence and MLS approval.
  directoryEvidence:
    listingPage: https://www.reso.org/certificates/
    listingPageStatus: 200
    section: Technology Company
    organizationName: MLS Grid
    uoi: T00000045
    directoryDate: '2023-04-06'
    directoryStatus: Certified Current
    summaryPage: https://certification.reso.org/summary/T00000045
    summaryPageNote: >-
      Single-page app; returns HTTP 400 to a default curl user-agent and HTTP 200 with a browser
      user-agent, but renders certification data client-side.
    dataSource: https://certification.reso.org/api/v1/certification_reports/summary/T00000045
    dataSourceStatus: 200
    dataSourceNote: >-
      Undocumented but publicly readable JSON endpoint discovered in the certification SPA bundle.
      Fetched anonymously 2026-07-26.
  certifications:
  - type: data_dictionary
    description: RESO Data Dictionary Metadata Report
    version: '2.0'
    status: certified
    reportGeneratedOn: '2024-04-05T21:54:37.753082Z'
    statusUpdatedAt: '2025-03-18T18:29:31.617Z'
    providerUoi: T00000045
    recipientUoi: T00000045
  - type: web_api_server_core
    description: Web API Server Core
    version: 2.0.0
    status: certified
    reportGeneratedOn: '2021-12-02T14:01:03.35Z'
    statusUpdatedAt: '2025-03-18T18:29:41.771Z'
    providerUoi: T00000045
    recipientUoi: T00000045
  reachability:
    metadataEndpoint: https://api.mlsgrid.com/v2/$metadata
    metadataAnonymousStatus: 401
    metadataAnonymousBody: '{"error":{"code":401,"message":"Unauthorized request: no authentication given"}}'
    serviceRootAnonymousStatus: 401
    propertyCollectionAnonymousStatus: 401
    demoHost: https://api-demo.mlsgrid.com/v2/
    demoHostAnonymousStatus: 401
    demoHostNote: >-
      api-demo.mlsgrid.com appears throughout the public v2 documentation as the host in example
      requests. It is NOT an open sandbox — it returns the same 401 as production.
    gzipGotcha: >-
      Without an Accept-Encoding header containing gzip the API returns HTTP 400
      "COMPRESSION REQUIRED" before it evaluates auth. Probing with --compressed is required to
      see the real 401. Recording the 400 as the answer would have been wrong.
  upi:
    universalPropertyIdentifierReferenced: false
    note: No mention of the RESO Universal Property Identifier (UPI) in master.md or the v2 API documentation.

accessGate:
  gate: licence-agreement
  selfServe: false
  publicSandbox: false
  publicPricing: false
  whatADeveloperMustSignOrJoin: |
    1. Accept the MLS Grid Master Data License Agreement — one standard agreement covering all
       feed types — through the MLS Grid online licensing portal. The agreement is published
       openly as a PDF at https://www.mlsgrid.com/s/MLS-GRID-Data-License-Agreement.pdf (HTTP 200).
    2. Have a data subscription created and a licensee added on the vendor account.
    3. Obtain approval from the originating MLS. Per docs.mlsgrid.com/master.md: "Once a
       subscription has been created, a licensee added, and the MLS has approved, an API token
       will be generated and presented on the token tab when viewing a subscription."
    4. Retrieve the long-lived OAuth 2.0 bearer token from the token tab of the subscription in
       the MLS Grid web application at https://app.mlsgrid.com/ (HTTP 200, member login).
  useCaseLicensing: >-
    Every record carries MlgCanUse, an array of the use cases the record may be used for — IDX
    (public consumer display), VOW (authenticated consumer display), BO (back office) and PT
    (broker only / participant data access) — and MlgCanView, a boolean that acts as the delete
    and licence-retention signal. Licensing is enforced in the payload, per record, not only in
    the contract.
  feeStructure: >-
    Per the public FAQ, MLS Grid collects the licence fee required by each participating MLS on
    that MLS's behalf. No price card is published.
  intakePath: https://www.mlsgrid.com/interest-form
  compliance: Quarterly compliance audits of vendor websites, described in the public benefits material.

openData:
  exists: false
  note: >-
    No open, unlicensed, publicly callable dataset. MLS Grid redistributes MLS listing data that is
    licensed by the originating MLSs; nothing is published as open data. The only genuinely open
    artifacts are the documentation itself and the third-party RESO certification records.

authModel:
  scheme: OAuth 2.0 bearer token (long-lived, issued out-of-band)
  header: 'Authorization: Bearer <access_token>'
  tokenIssuance: >-
    Not a token endpoint. Tokens are generated in the MLS Grid web application once a subscription
    exists and the MLS has approved; MLS Grid describes it as "a simplified Oauth 2 authentication
    schema with long term tokens" because "trust has already been established via the subscription
    sign up process."
  rotation: Contact support to regenerate and invalidate the old token.
  openidConfiguration:
    probed: https://api.mlsgrid.com/.well-known/openid-configuration
    status: 400
    note: >-
      Returns the same "COMPRESSION REQUIRED" 400 as any other unhandled path; no OpenID Connect
      discovery document is served. https://www.mlsgrid.com/.well-known/openid-configuration is 404.
  additionalRequirement: >-
    Media downloads require the HTTP User-Agent header to be set to the OAuth 2 access token
    itself; from 2026-06-01 any other User-Agent is denied media access. Media URLs may only be
    used to download a local copy, never hot-linked.

homeMarket:
  country: United States
  scope: >-
    Documented OriginatingSystemName values enumerate 37 participating originating systems in the
    v2 API documentation, including ACTRIS, Canopy MLS, Heartland MLS, MRED, NorthstarMLS,
    Northwest MLS, OneKey MLS, REcolorado, RealTracs, Stellar MLS, MIBOR, MARIS and IRES.
  governance: >-
    Created by a network of MLSs; a Board of Managers is drawn from participating MLS executives
    (chaired by the MRED CEO), with MLS Grid's own CEO and CTO as staff. Verified from
    https://www.mlsgrid.com/whoisthemlsgrid.

