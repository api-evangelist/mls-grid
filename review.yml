webhooksEventsSdks:
  webhooks: false
  events: false
  sdks: false
  postman: false
  cli: false
  statusPage: false
  githubOrganization:
    url: https://github.com/mlsgrid
    exists: true
    type: Organization
    name: The MLS Grid
    publicRepos: 0
    createdAt: '2019-10-29T04:11:56Z'
  note: >-
    Absence is the finding. MLS Grid explicitly states it does not support real-time access:
    "We do not support real time data access at this time. Our service provides the data through
    a data replication process." Consumers poll on a ModificationTimestamp watermark. There is no
    push, no webhook, no event stream, no first-party SDK, no CLI, and no public status page
    (status.mlsgrid.com does not resolve; /status is 404). The GitHub organization was registered
    in 2019 and has never published a repository.

rateLimits:
  requestsPerSecond: 2
  requestsPerHour: 7200
  requestsPer24Hours: 40000
  dataVolumePerHour: 4 GB
  enforcement: HTTP 429 plus automatic access-token suspension; reinstated automatically once usage falls back within limits.
  exceptions: Email support@mlsgrid.com in advance.
  source: https://docs.mlsgrid.com/master.md

