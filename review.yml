    An older API Evangelist repo for this same company already exists locally under the slug
    "mlsgrid" (created 2026-05-25, apis.yml specificationVersion 0.16, seven derived per-resource
    OpenAPIs, plans/rate-limits/finops/vocabulary artifacts). This repo was bootstrapped as
    "mls-grid" because that slug was assigned by the real-estate sector study. These are the same
    organization and one of them should be retired and tombstoned per the duplicate-provider
    retirement process before either is published.
  caution: >-
    The OpenAPIs in the mlsgrid repo are API Evangelist-DERIVED, hand-authored from the
    documentation — they are not published by MLS Grid. They must not be credited to the provider
    when scoring.

