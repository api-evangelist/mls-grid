strengths:
- Documentation is genuinely public and complete — full v2 API reference served as markdown, plus an llms.txt index, with no login wall.
- Real RESO certification, third-party verifiable in the RESO directory: Data Dictionary 2.0 and Web API Server Core 2.0.0.
- One Master Data License Agreement replaces per-MLS licensing across 37 documented originating systems, and the agreement itself is published openly as a PDF.
- Rate limits, enforcement behaviour and suspension/reinstatement semantics are documented precisely and publicly.
- Licence terms are expressed in the payload as first-class fields (MlgCanView, MlgCanUse) rather than left to contract prose.
- Key fields are namespaced per originating MLS so a consumer can merge multiple MLSs without collisions.

gaps:
- The OData $metadata document — the machine-readable contract behind the RESO certification — is not anonymously retrievable. Certification is verifiable; the contract is not.
- No OpenAPI, Postman collection, SDK, CLI or code sample repository. The GitHub organization has zero public repositories after seven years.
- No sandbox. The api-demo host used throughout the documentation is authenticated, so no one can execute a single documented example before signing.
- No self-serve onboarding, no published pricing, no time-boxed trial.
- No webhooks or event stream; replication is poll-only by explicit design.
- No public status page or SLA.

